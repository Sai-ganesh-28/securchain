<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - securachain</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="auth.js"></script>
    <script>
        // Redirect to dashboard if already logged in with valid token
        const token = localStorage.getItem('token');
        if (token && !isTokenExpired(token)) {
            window.location.replace('/index.html');
        }
    </script>
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <h1>Welcome Back</h1>
                <p>Sign in to continue to securachain</p>
            </div>

            <div class="google-auth">
                <div id="g_id_onload"
                     data-client_id="264190197326-bis4pnpbtembmbdi73gddpjara5g2643.apps.googleusercontent.com"
                     data-context="signin"
                     data-callback="handleGoogleResponse">
                </div>
                <div class="g_id_signin"
                     data-type="standard"
                     data-size="large"
                     data-theme="filled_blue"
                     data-text="signin_with"
                     data-shape="rectangular"
                     data-width="300">
                </div>
            </div>

            <div class="divider">
                <span>or</span>
            </div>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <button type="submit" class="submit-btn">Sign In</button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a href="register.html">Sign up</a></p>
            </div>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
